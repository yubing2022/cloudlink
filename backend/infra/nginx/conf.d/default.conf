upstream cloudlink_backend {
    server backend:8000;
}

# HTTP - direct IP for now (will add HTTPS after domain setup)
server {
    listen 80 default_server;
    server_name _;  # accept all hosts (IP-based for now)

    # Allow ACME challenges for future Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://cloudlink_backend/health;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://cloudlink_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # WebSocket endpoints (note: must be before /api/ catch-all)
    location /api/ws/ {
        proxy_pass http://cloudlink_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Old /ws/ path (kept for backwards compat)
    location /ws/ {
        proxy_pass http://cloudlink_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Swagger UI
    location /docs {
        proxy_pass http://cloudlink_backend/docs;
    }

    location /openapi.json {
        proxy_pass http://cloudlink_backend/openapi.json;
    }

    location /redoc {
        proxy_pass http://cloudlink_backend/redoc;
    }

    # Default
    location / {
        return 200 'CloudLink API. See /docs for Swagger UI.';
        add_header Content-Type text/plain;
    }
}


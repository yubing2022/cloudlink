version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cloudlink-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudlink
      POSTGRES_USER: cloudlink
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudlink"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloudlink-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
